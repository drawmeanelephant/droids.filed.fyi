name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate content
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-boris
      - name: Validate
        run: boris validate --input content --theme manila --layout-rule default id:index manila/layouts/trunk.html
      - name: Validate reusable content starter
        run: boris validate --input examples/review-site/content --theme manila --layout-rule default id:index manila/layouts/trunk.html
      - name: Test theme
        run: node --test tests/*.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify mascot assets
        run: |
          python -m pip install -r tools/requirements-mascots.txt
          python tools/build-mascots.py --check

  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-boris
      - name: Build HTML
        run: |
          boris build --input content --html-dir dist \
            --theme manila --sitemap --site-url https://droids.filed.fyi/ \
            --layout-rule default id:index manila/layouts/trunk.html \
            --static-dir static
      - name: Build RSS
        run: |
          boris build --input content --rss --rss-path dist/rss.xml \
            --site-url https://droids.filed.fyi/ \
            --rss-title "droids.filed.fyi" \
            --rss-description "Factory AI field notes — what I delegated, what shipped, and every nit in between."
      - name: Check graph health
        run: boris check --input content

  check-dist:
    name: Verify dist output
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-boris
      - name: Rebuild to verify reproducibility
        run: |
          boris build --input content --html-dir dist \
            --theme manila --sitemap --site-url https://droids.filed.fyi/ \
            --layout-rule default id:index manila/layouts/trunk.html \
            --static-dir static
      - name: Check dist has content
        run: |
          COUNT=$(find dist -name '*.html' | wc -l)
          echo "Generated $COUNT HTML files"
          [ "$COUNT" -gt 5 ]
          test -f dist/robots.txt
          test -f dist/humans.txt
          test -f dist/cyborgs.txt
