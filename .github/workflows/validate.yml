name: validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout site
        uses: actions/checkout@v5

      - name: Set up boris
        uses: ./.github/actions/setup-boris

      - name: Validate content graph (zero-write preflight)
        run: |
          boris validate --input content --theme manila \
            --layout-rule default id:index manila/layouts/trunk.html
